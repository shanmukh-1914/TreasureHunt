<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Riddle Quest · SAMYAK-2026</title>
<meta name="color-scheme" content="dark">
<style>
:root{box-sizing:border-box;--bg:#080b1a;--card:rgba(20,26,56,.72);--ink:#eef1ff;--mute:#9aa3d1;--a:#7c5cff;--b:#22d3ee;--ok:#34d399;--bad:#fb7185;--gold:#fbbf24;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;perspective:1200px}
.card{width:min(560px,100%);background:var(--card);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 60px rgba(124,92,255,.25);transform-style:preserve-3d;transition:transform .15s ease-out}
h1{margin:0 0 6px;font-size:1.7rem;background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{margin:0 0 18px;color:var(--mute)}
input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:var(--ink);font-size:1rem;outline:none}
input:focus{border-color:var(--b)}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--a),#4f46e5);transform:translateZ(20px);transition:filter .15s,transform .1s}
button:hover{filter:brightness(1.15)}button:active{transform:scale(.97)}
button.ghost{background:rgba(255,255,255,.1)}button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.row>*{flex:1}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:.9rem;color:var(--mute)}
.pts{font-size:1.25rem;font-weight:700;color:var(--gold)}
.prog{height:6px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--a));transition:width .4s}
.riddle{font-size:1.12rem;line-height:1.6;margin:6px 0 16px;transform:translateZ(30px)}
.hint{margin-top:10px;padding:10px 13px;border-radius:10px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:#fde68a;font-size:.95rem}
.msg{min-height:24px;margin-top:10px;font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.95rem}
td,th{padding:8px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.1)}th{color:var(--mute);font-weight:600}
.me{color:var(--b);font-weight:700}
.win{text-align:center;font-size:1.3rem;margin:10px 0;color:var(--gold)}
.big{font-size:2.6rem;text-align:center;margin:4px 0}
.hide{display:none}
.link{background:none;padding:6px;color:var(--mute);font-size:.85rem;text-decoration:underline;transform:none}
</style></head>
<body>
<canvas id="bg"></canvas>
<main><div class="card" id="card">

<section id="s-start">
<h1>Campus Riddle Quest</h1>
<p class="sub">SAMYAK-2026 · 20 riddles · start with 200 points. +100 per correct answer, −25 per hint.</p>
<input id="name" maxlength="24" placeholder="Enter your name" autocomplete="off">
<div class="row"><button id="go">Start Playing</button></div>
<div class="msg bad" id="nmsg"></div>
<div id="lb0"></div>
</section>

<section id="s-play" class="hide">
<div class="bar"><span id="who"></span><span>Points <span class="pts" id="pts">200</span></span></div>
<div class="prog"><i id="pg"></i></div>
<div class="bar"><span id="qn"></span><span id="solved"></span></div>
<div class="riddle" id="rd"></div>
<div id="hn"></div>
<input id="ans" placeholder="Your answer" autocomplete="off">
<div class="row"><button id="sub">Submit</button><button class="ghost" id="hint">Hint (−25)</button></div>
<div class="msg" id="msg"></div>
<button class="link" id="out">Switch player</button>
</section>

<section id="s-end" class="hide">
<div class="big">🏆</div>
<h1 style="text-align:center" id="fin"></h1>
<div class="win" id="winner"></div>
<div id="lb1"></div>
<div class="row"><button id="again">Next Player</button></div>
</section>

</div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Riddles: [text, hint, [accepted answers]] ---------- */
const Q=[
["I have no board outside and I am not on the main road. Only people who know me find me, and they come for coffee and a quiet break. My name says I am not easy to spot. Where am I?","Two words: the first means ‘not visible’, the second is where you get coffee.",["hiddencafe","klhiddencafe"]],
["Classes are over and the sun is going down. Suddenly the whole campus walks in one direction, towards me, for snacks and tea. I am named after a person. Which canteen am I?","I am not the KL one. My name is a first name that starts with S.",["satish"]],
["You come to me in the morning for breakfast and again in the afternoon for lunch. I am the biggest canteen with the college initials in my name. Which canteen am I?","Not the evening one. I serve breakfast and lunch.",["maincanteen","klmaincanteen"]],
["Two batters, eleven fielders, one ball and a big green field. Today the main event of the day happens on me. Where am I?","Think of the sport that is played with a bat, stumps and a pitch.",["cricketground","cricket"]],
["A blacksmith shapes hot iron into tools. We shape students into tech builders. We are a club of the ELGE department that conducts events. Who are we?","A forge is where a blacksmith works. Add the word ‘club’.",["forgeclub","forge"]],
["I have a stage but no roof. The sky is my ceiling. Mini events and ethnic day happen on me, and people watch in the open air. Which place am I?","Three words, short form OAT: ‘open’, ‘air’ and a place for performances.",["openairtheatre","oat"]],
["Many events happen inside me. Samyak will be inaugurated here. I am a hall, and I am the newest one on campus. Where am I?","Three words: new, a hall for talks and events, and the place where inaugurations happen.",["newseminarhall","seminarhall"]],
["Badminton, carrom, chess and table tennis all live under my roof. Rain never stops the game here. Which place am I?","I am a sports complex, and my first word means ‘inside’.",["indoorcomplex","indoor"]],
["Two canteens feed the campus. One is busy from morning to afternoon, and the other is full only in the evening. Which one is full in the evening?","The one named after a person, not the KL one.",["satish"]],
["Two canteens feed the campus. One is crowded for snacks at sunset, and the other serves two full meals at breakfast and lunch. Which one serves the two meals?","It has KL in its name and it is the ‘main’ one.",["maincanteen","klmaincanteen"]],
["I am a cafe, but you will not find me easily. My own name tells you I am concealed. If you take away the word cafe, my name means ‘not seen’. Where am I?","Hidden.",["hiddencafe","klhiddencafe"]],
["I am a big building for sports. Players use me for games that need a court, a table, or a board. All of them are played inside. Which place am I?","I am a complex and I am for indoor games.",["indoorcomplex","indoor"]],
["Cricket, batting, bowling and a green outfield: I am the ground where the main matches and events of today are held. Where am I?","Sport, grass, and the sport’s name is the first word of my name.",["cricketground","cricket"]],
["I am not a class or a lab, but a club. My members build, code and create. I belong to the ELGE department and my name is the same as a blacksmith’s workshop. What is my name?","Forge.",["forgeclub","forge"]],
["No walls, no roof, only a stage and the evening sky. Dance, music and ethnic day events are held here in the open. Where am I?","OAT is my short name.",["openairtheatre","oat"]],
["I have a big stage, a projector and rows of seats. Inaugurations and many events start in me, and I am the newest hall on campus. Where am I?","Not the old one. I am the new seminar hall.",["newseminarhall","seminarhall"]],
["If you go to a canteen for breakfast at 8 AM and again for lunch at 1 PM, which canteen are you most likely in? (It is not the one for evening snacks.)","It is the main one, with KL in its name.",["maincanteen","klmaincanteen"]],
["A cafe is hidden somewhere in KL. Few people know it and it is a calm place to sit with friends. Name the cafe.","Two words: ‘hidden’ and a place for coffee.",["hiddencafe","klhiddencafe"]],
["Everyone says ‘let us meet at the canteen after class’. It is evening, nobody has a plan, but all of them end up in the same place for tea and snacks. Which canteen is it?","Think of the evening favourite, named after a person.",["satish"]],
["I am our college fest. I start with an inauguration in the new seminar hall. The singer Karthik will perform, and I run for two days, the 30th and the 31st. My name ends with the year 2026. What am I?","The fest name starts with S and has 2026 in it.",["samyak","samyak2026"]]
];
const N=Q.length,KEY="samyak_riddles_v1";

/* ---------- Storage (safe) ---------- */
let DB={players:{},current:null};
function load(){try{const r=localStorage.getItem(KEY);if(r)DB=JSON.parse(r)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=()=>DB.players[DB.current];

function show(id){["s-start","s-play","s-end"].forEach(x=>$(x).classList.toggle("hide",x!==id))}

function board(el){
  const list=Object.values(DB.players).sort((a,b)=>b.score-a.score);
  if(!list.length){$(el).innerHTML="";return}
  $(el).innerHTML="<table><tr><th>#</th><th>Player</th><th>Points</th><th>Status</th></tr>"+
  list.map((p,i)=>`<tr class="${p.name===DB.current?'me':''}"><td>${i+1}</td><td>${esc(p.name)}</td><td>${p.score}</td><td>${p.done?'Finished':p.idx+'/'+N}</td></tr>`).join("")+"</table>";
}

function start(){
  const n=$("name").value.trim();
  if(n.length<2){$("nmsg").textContent="Please enter your name (at least 2 characters).";return}
  const k=n.toLowerCase();
  if(!DB.players[k])DB.players[k]={name:n,score:200,idx:0,hints:{},done:false};
  DB.current=k;save();render();
}

function render(){
  const p=P();
  if(!p){show("s-start");board("lb0");return}
  if(p.done){finish();return}
  show("s-play");
  $("who").textContent="👤 "+p.name;$("pts").textContent=p.score;
  $("qn").textContent=`Riddle ${p.idx+1} of ${N}`;
  $("solved").textContent=`Solved ${p.idx}`;
  $("pg").style.width=(p.idx/N*100)+"%";
  $("rd").textContent=Q[p.idx][0];
  $("hn").innerHTML=p.hints[p.idx]?`<div class="hint">💡 ${esc(Q[p.idx][1])}</div>`:"";
  $("hint").disabled=!!p.hints[p.idx];
  $("ans").value="";$("msg").textContent="";$("msg").className="msg";
}

function submit(){
  const p=P(),v=norm($("ans").value);if(v.length<3)return;
  const ok=Q[p.idx][2].some(a=>v.includes(a)||a===v);
  const m=$("msg");
  if(ok){
    p.score+=100;p.idx++;if(p.idx>=N)p.done=true;
    save();m.className="msg ok";m.textContent="Correct! +100 points";$("pts").textContent=p.score;
    setTimeout(render,650);
  }else{
    m.className="msg bad";m.textContent="Not quite. Think again.";
    const c=$("card");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");
  }
}

function hint(){
  const p=P();if(p.hints[p.idx])return;
  p.hints[p.idx]=1;p.score=Math.max(0,p.score-25);save();render();
}

function finish(){
  show("s-end");
  const p=P();
  $("fin").textContent=`${p.name}, you finished with ${p.score} points!`;
  const done=Object.values(DB.players).filter(x=>x.done).sort((a,b)=>b.score-a.score);
  const top=done[0];
  $("winner").textContent=top?`👑 Current winner: ${top.name} (${top.score} pts)`:"";
  board("lb1");
}

$("go").onclick=start;
$("name").onkeydown=e=>{if(e.key==="Enter")start()};
$("sub").onclick=submit;
$("ans").onkeydown=e=>{if(e.key==="Enter")submit()};
$("hint").onclick=hint;
$("out").onclick=()=>{DB.current=null;save();render()};
$("again").onclick=()=>{DB.current=null;save();$("name").value="";render()};

/* ---------- 3D card tilt ---------- */
const card=$("card");
document.addEventListener("pointermove",e=>{
  const x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);
  card.style.transform=`rotateY(${x*10}deg) rotateX(${-y*10}deg)`;
});

/* ---------- Three.js background ---------- */
try{
  const cv=$("bg"),r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,100);cam.position.z=9;
  const shapes=[];
  [[new THREE.IcosahedronGeometry(2,0),0x7c5cff,-4,1],[new THREE.TorusKnotGeometry(1,.3,80,12),0x22d3ee,4.5,-1.5],[new THREE.OctahedronGeometry(1.2),0xfbbf24,-5,-3],[new THREE.TorusGeometry(1.3,.35,12,40),0x34d399,5,3]].forEach(([g,c,x,y])=>{
    const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:c,wireframe:true,transparent:true,opacity:.55}));
    m.position.set(x,y,-2);sc.add(m);shapes.push(m)});
  const pg=new THREE.BufferGeometry(),pos=[];
  for(let i=0;i<500;i++)pos.push((Math.random()-.5)*40,(Math.random()-.5)*28,(Math.random()-.5)*30);
  pg.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xaab4ff,size:.06}));sc.add(pts);
  function rs(){r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
  rs();addEventListener("resize",rs);
  let mx=0,my=0;addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
  (function loop(){requestAnimationFrame(loop);
    shapes.forEach((s,i)=>{s.rotation.x+=.003*(i+1);s.rotation.y+=.004});
    pts.rotation.y+=.0006;
    cam.position.x+=(mx*3-cam.position.x)*.04;cam.position.y+=(-my*2-cam.position.y)*.04;cam.lookAt(0,0,0);
    r.render(sc,cam)})();
}catch(e){}

load();render();
</script>
</body></html>
